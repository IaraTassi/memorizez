spring.application.name=memorizez

spring.config.import=optional:file:./.env[.properties]

server.port=${PORT:8080}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/${MEMORIZEZ_DB_NAME:memorizez}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${MEMORIZEZ_DB_USER:memorizez}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${MEMORIZEZ_DB_PASSWORD:}}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5500,http://127.0.0.1:5500}
logging.level.org.springframework.security=DEBUG