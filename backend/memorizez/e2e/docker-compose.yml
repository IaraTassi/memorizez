services:
  postgres:
    image: postgres:16
    container_name: memorizez-e2e-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: memorizez_e2e
      POSTGRES_USER: memorizez
      POSTGRES_PASSWORD: memorizez
    ports:
      - "5433:5432"
    volumes:
      - memorizez-e2e-postgres-data:/var/lib/postgresql/data

volumes:
  memorizez-e2e-postgres-data: