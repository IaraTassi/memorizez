<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Estudar — MemorizeZ</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/styles.css" />
    <link rel="stylesheet" href="css/study.css" />
  </head>

  <body class="private-page" data-page="study">
    <main id="main-content" class="private-main">
      <section class="page-container study-page" aria-labelledby="pageTitle">
        <h1 id="pageTitle" class="visually-hidden">Revisão</h1>
        <header class="study-header">
          <h2 id="studyCollectionName" class="study-collection-name"></h2>
          <div
            id="study-progress"
            class="study-progress"
            role="group"
            aria-label="Progresso da revisão"
          >
            <div class="study-progress-info">
              <span id="study-progress-count"> 0/0 cartões </span>
              <span id="study-progress-percentage"> 0% </span>
            </div>

            <div
              id="study-progress-track"
              class="study-progress-track"
              role="progressbar"
              aria-label="Progresso da revisão"
              aria-valuemin="0"
              aria-valuemax="100"
              aria-valuenow="0"
            >
              <div id="study-progress-bar" class="study-progress-bar"></div>
            </div>
          </div>
        </header>

        <div
          id="study-message"
          class="study-message"
          role="status"
          aria-live="polite"
        ></div>

        <div id="study-content"></div>
      </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js" defer></script>
    <script src="js/private-layout.js" defer></script>
    <script src="js/study.js" defer></script>
  </body>
</html>
